[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

# tsrs, pinned: the fork branch `rbxts-fork-0.23.0` (v0.23.0 plus visibility flips), as a git dependency pinned by rev so
# rbxts-rs builds the same tsrs as a dependency of another workspace (flamework-rs) as in its own. The fork is public at
# https://github.com/rbxts-rs/tsrs; a local tsrs checkout can override it with `[patch]` (docs/tsrs.md).
# Cargo.lock started as a copy of tsrs's lock file so the transitive versions match what tsrs tests with.
[workspace.dependencies]
tsrs_core = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_ast = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_vfs = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_tsoptions = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_compiler = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_diagnostics = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_checker = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_scanner = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_parser = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_printer = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_sourcemap = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
mimalloc-safe = { version = "0.1.67", features = ["v3", "no_thp"] }
rbxts_project = { path = "crates/rbxts_project" }
rbxts_luau = { path = "crates/rbxts_luau" }
rbxts_luau_check = { path = "crates/rbxts_luau_check" }
# preserve_order: Rojo trees iterate children in file order, as JavaScript objects do.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tsrs_module = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
tsrs_contentmapper = { git = "https://github.com/rbxts-rs/tsrs", rev = "c136955df608d167d1b4139e1cb0a8b142b2c82d" }
rbxts_transform = { path = "crates/rbxts_transform" }
rbxts_plugin = { path = "crates/rbxts_plugin" }
rbxts_cli = { path = "crates/rbxts_cli" }
rbxts_test_plugins = { path = "crates/rbxts_test_plugins" }
rbxts_test_support = { path = "crates/rbxts_test_support" }
# The versions in tsrs's lock file.
rustc-hash = "2"
# rbxts_cli watch mode: file system events (ReadDirectoryChangesW on Windows) and the process working set (the
# restart past a memory limit).
notify = { version = "8.2.0", default-features = false }
memory-stats = "1.2.0"
# rbxts_cli watch mode: the status line's local time (TypeScript's `toLocaleTimeString()`, formatted by `locale_time`).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# A debug checker is unusably slow, so even dev builds are optimised (as in tsrs).
[profile.dev]
opt-level = 3
lto = "off"
codegen-units = 256
incremental = true

# Luau (rbxts_luau_check, built by luau0-src) without its asserts in every profile: luau0-src turns them on under
# debug_assertions, and a failed one ends in __debugbreak (a crash) instead of an error. A build dependency, so this
# package override (it wins over build-override) is what reaches it.
[profile.dev.package.luau0-src]
debug-assertions = false

# Measurements: release optimisation without LTO, like tsrs's `ci` profile (the tsrs.exe we compare against).
[profile.measure]
inherits = "release"
lto = "off"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
